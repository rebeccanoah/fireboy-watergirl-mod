<!-- ==================== [CRITICAL INTERVENTION: MUTUAL EXTINCTION] ==================== -->
<script>
    // 监听关卡运行状态，对每一关的角色自动挂载碰撞致死
    setInterval(function() {
        if (window.Phaser && window.Phaser.GAMES && window.Phaser.GAMES[0]) {
            var s = window.Phaser.GAMES[0].state.getCurrentState();
            // 确保进入了关卡并且角色已经生成，且尚未挂载拦截
            if (s && s.key === "level" && s.pers1 && s.pers2 && !s._modHooked) {
                s._modHooked = true;
                
                var oldUpdate = s.pers1.update;
                s.pers1.update = function() {
                    if (s.pers1 && s.pers2 && s.pers1.body && s.pers2.body && !s._isDeadTriggered) {
                        var dx = s.pers1.body.x - s.pers2.body.x;
                        var dy = s.pers1.body.y - s.pers2.body.y;
                        var dist = Math.sqrt(dx * dx + dy * dy);

                        // 触碰距离阈值设为 36 像素
                        if (dist < 36) {
                            s._isDeadTriggered = true;
                            if (typeof s.pers1.kill === "function") s.pers1.kill();
                            if (typeof s.pers2.kill === "function") s.pers2.kill();
                            s.gameOver();
                            return;
                        }
                    }
                    return oldUpdate.apply(this, arguments);
                };
            }
        }
    }, 200);
</script>
